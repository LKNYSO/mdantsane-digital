  <script>
    const themes = {
      amber: { primary: "#78350f", dark: "#451a03", badgeBg: "#92400e", badgeText: "#fef3c7", softBg: "#fffbeb" },
      navy: { primary: "#1e3a8a", dark: "#172554", badgeBg: "#1d4ed8", badgeText: "#dbeafe", softBg: "#eff6ff" },
      maroon: { primary: "#881337", dark: "#4c0519", badgeBg: "#9f1239", badgeText: "#ffe4e6", softBg: "#fff1f2" },
      emerald: { primary: "#065f46", dark: "#022c22", badgeBg: "#047857", badgeText: "#d1fae5", softBg: "#ecfdf5" },
      charcoal: { primary: "#18181b", dark: "#09090b", badgeBg: "#ca8a04", badgeText: "#ffffff", softBg: "#fefce8" }
    };

    let activeQrColor = "#451a03";

    function renderQrCode() {
      const qrContainer = document.getElementById("live-qr-code");
      const shareUrl = window.location.href;
      qrContainer.innerHTML = "";

      try {
        if (typeof QRCode !== "undefined") {
          new QRCode(qrContainer, {
            text: shareUrl,
            width: 200,
            height: 200,
            colorDark: activeQrColor,
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
          });
          return;
        }
      } catch (e) {
        console.warn("QR fallback used:", e);
      }

      const img = document.createElement("img");
      img.src = "https://qrserver.com" + encodeURIComponent(shareUrl);
      img.alt = "Event QR Code";
      img.width = 200;
      img.height = 200;
      qrContainer.appendChild(img);
    }

    function openQrModal() {
      const titleEl = document.getElementById("event-title");
      const modalTitleEl = document.getElementById("modal-event-title");
      if (titleEl && modalTitleEl) {
        modalTitleEl.textContent = titleEl.textContent;
      }
      renderQrCode();
      document.getElementById("qr-modal").classList.remove("hidden");
    }

    function closeQrModal() {
      document.getElementById("qr-modal").classList.add("hidden");
    }

    async function loadEventProgram() {
      const params = new URLSearchParams(window.location.search);
      const pathParts = window.location.pathname.split("/").filter(Boolean);
      const slug = params.get("e") || (pathParts[0] === "e" ? pathParts[1] : null) || "demo";

      try {
        const response = await fetch("/events/" + slug + ".json");
        if (!response.ok) throw new Error("Event not found");
        const eventData = await response.json();

        const selectedTheme = themes[eventData.theme] || themes.amber;
        activeQrColor = selectedTheme.dark;

        const root = document.documentElement;
        root.style.setProperty("--theme-primary", selectedTheme.primary);
        root.style.setProperty("--theme-dark", selectedTheme.dark);
        root.style.setProperty("--theme-badge-bg", selectedTheme.badgeBg);
        root.style.setProperty("--theme-badge-text", selectedTheme.badgeText);
        root.style.setProperty("--theme-soft-bg", selectedTheme.softBg);

        document.title = eventData.title + " — Event Program";
        document.getElementById("event-type").textContent = eventData.type;
        document.getElementById("event-title").textContent = eventData.title;
        document.getElementById("event-date").textContent = eventData.date;
        document.getElementById("event-venue").textContent = eventData.venue;
        document.getElementById("welcome-note").textContent = eventData.welcomeNote;
        document.getElementById("map-link").href = eventData.mapUrl;

        document.getElementById("schedule-list").innerHTML = eventData.schedule.map(item => `
          <div class="bg-white p-4 rounded-xl shadow-sm border border-stone-100 flex items-start gap-3.5">
            <div class="bg-theme-soft font-bold text-xs px-2.5 py-1.5 rounded-lg shrink-0 mt-0.5">
              ${item.time}
            </div>
            <div>
              <h3 class="font-semibold text-sm text-stone-900">${item.title}</h3>
              <p class="text-xs text-stone-500 mt-0.5">${item.lead}</p>
            </div>
          </div>
        `).join("");

        document.getElementById("people-list").innerHTML = eventData.keyPeople.map(person => `
          <li class="flex justify-between items-center border-b border-stone-100 pb-2 last:border-none last:pb-0">
            <span class="text-stone-500 text-xs">${person.role}</span>
            <span class="font-semibold text-stone-800 text-xs">${person.name}</span>
          </li>
        `).join("");

      } catch (error) {
        console.error(error);
      }
    }

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").catch(err => console.log("SW failed:", err));
      });
    }

    loadEventProgram();
  </script>
